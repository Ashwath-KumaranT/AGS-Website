name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow one deploy at a time; let a running one finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # run before the build: it reports the URL the site will be served from
      - uses: actions/configure-pages@v5
        id: pages
      # Pages serves a project site from /<repo>/ and a custom domain from /. Vite's base
      # needs the trailing slash; the canonical URL in VITE_SITE_URL must not have one.
      - name: Work out the base path
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base" ]; then base="/"; fi
          case "$base" in */) ;; *) base="$base/" ;; esac
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=${{ steps.pages.outputs.origin }}${base%/}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          VITE_DATA_SOURCE: mock
      # Pages has no rewrite rules, so an unknown path would 404 before React Router sees
      # it. Serving the app shell as the 404 page lets the router handle deep links.
      - run: cp dist/index.html dist/404.html
      # stop Pages running the output through Jekyll
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
