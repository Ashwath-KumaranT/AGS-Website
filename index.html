<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>ASG — Modern essentials for everyday wear</title>
    <meta
      name="description"
      content="ASG (Arun Sakthi Garments) is a modern clothing house. Shop considered essentials for men, women and kids — free shipping over ₹1,999."
    />
    <meta property="og:site_name" content="ASG" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ASG — Modern essentials for everyday wear" />
    <meta
      property="og:description"
      content="Considered essentials for men, women and kids. Free shipping over ₹1,999."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&family=Noto+Serif+Tamil:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('atelier-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
